name: Daily PIB UPSC Brief Automation

on:
  schedule:
    # Runs twice daily:
    # 02:30 UTC = 08:00 AM IST (Morning bulletin)
    # 15:30 UTC = 09:00 PM IST (Evening comprehensive bulletin)
    - cron: '30 2 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

permissions:
  contents: write

jobs:
  run-pib-automation:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily PIB Pipeline
        run: |
          python main.py --today

      - name: Upload Daily Brief Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pib-daily-briefs
          path: output/*.*
          retention-days: 30

      - name: Dispatch Email to Recipient
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🇮🇳 PIB UPSC Daily Compilation
          to: ${{ secrets.MAIL_TO }}
          from: PIB UPSC Automation <${{ secrets.MAIL_USERNAME }}>
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 15px;">
              <h2 style="color: #1E3A8A;">🇮🇳 PIB Daily UPSC Intelligence</h2>
              <p>Your automated daily PIB briefing has been compiled and aligned with the UPSC syllabus.</p>
              <p>Please find attached today's <b>Word Brief (.docx)</b> and <b>Excel Tracker (.xlsx)</b> files.</p>
            </div>
          attachments: output/*.*

      - name: Commit and Push Daily Archive
        run: |
          git config --global user.name "PIB Automation Bot"
          git config --global user.email "bot@pib-upsc.internal"
          git add -A output/
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-archive: Daily PIB UPSC Brief $(date +'%Y-%m-%d')"
            git push
          fi
