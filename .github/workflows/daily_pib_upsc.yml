name: Daily PIB UPSC Brief Automation

on:
  schedule:
    # Runs daily at 15:30 UTC = 09:00 PM IST (Evening comprehensive bulletin)
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

permissions:
  contents: write

jobs:
  run-pib-automation:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Kolkata'
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily PIB Pipeline
        id: pipeline
        run: |
          python main.py --today

      - name: Validate Current Run Artifacts
        id: files
        env:
          RUN_STATUS: ${{ steps.pipeline.outputs.status }}
          RUN_DOCX: ${{ steps.pipeline.outputs.docx }}
          RUN_XLSX: ${{ steps.pipeline.outputs.xlsx }}
          RUN_HTML: ${{ steps.pipeline.outputs.email_html }}
          RUN_DATE: ${{ steps.pipeline.outputs.date_code }}
          RUN_MANIFEST: ${{ steps.pipeline.outputs.manifest }}
        run: |
          set -euo pipefail
          test "$RUN_STATUS" = "complete"
          test "$RUN_DATE" = "$(date +'%Y-%m-%d')"
          for path in "$RUN_DOCX" "$RUN_XLSX" "$RUN_HTML" "$RUN_MANIFEST"; do
            test -n "$path" && test -s "$path"
          done
          echo "docx=$RUN_DOCX" >> "$GITHUB_OUTPUT"
          echo "xlsx=$RUN_XLSX" >> "$GITHUB_OUTPUT"
          echo "email_html=$RUN_HTML" >> "$GITHUB_OUTPUT"
          echo "manifest=$RUN_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "date_code=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "attachments=$RUN_DOCX,$RUN_XLSX" >> "$GITHUB_OUTPUT"

      - name: Upload Daily Brief Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pib-daily-brief-${{ steps.files.outputs.date_code }}
          path: |
            ${{ steps.files.outputs.docx }}
            ${{ steps.files.outputs.xlsx }}
            ${{ steps.files.outputs.email_html }}
            ${{ steps.files.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch Email to Recipient
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🇮🇳 PIB UPSC Daily Compilation - ${{ steps.files.outputs.date_code }}
          to: ${{ secrets.MAIL_TO }}
          from: PIB UPSC Automation <${{ secrets.MAIL_USERNAME }}>
          html_body: file://${{ steps.files.outputs.email_html }}
          attachments: ${{ steps.files.outputs.attachments }}

      - name: Commit and Push Daily Archive
        env:
          RUN_DOCX: ${{ steps.files.outputs.docx }}
          RUN_XLSX: ${{ steps.files.outputs.xlsx }}
          RUN_HTML: ${{ steps.files.outputs.email_html }}
          RUN_MANIFEST: ${{ steps.files.outputs.manifest }}
        run: |
          git config --global user.name "PIB Automation Bot"
          git config --global user.email "bot@pib-upsc.internal"
          git add -- "$RUN_DOCX" "$RUN_XLSX" "$RUN_HTML" "$RUN_MANIFEST"
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-archive: Daily PIB UPSC Brief $(date +'%Y-%m-%d')"
            git push
          fi
