name: Daily PIB UPSC Brief Automation

on:
  schedule:
    # Runs twice daily:
    # 02:30 UTC = 08:00 AM IST (Morning bulletin)
    # 15:30 UTC = 09:00 PM IST (Evening comprehensive bulletin)
    - cron: '30 2 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

permissions:
  contents: write

jobs:
  run-pib-automation:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily PIB Pipeline
        run: |
          python main.py --today

      - name: Upload Daily Brief Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pib-daily-briefs
          path: output/*.*
          retention-days: 30

      - name: Dispatch Email to Recipient
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python send_email.py

      - name: Commit and Push Daily Archive
        run: |
          git config --global user.name "PIB Automation Bot"
          git config --global user.email "bot@pib-upsc.internal"
          git add -A output/
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-archive: Daily PIB UPSC Brief $(date +'%Y-%m-%d')"
            git push
          fi
