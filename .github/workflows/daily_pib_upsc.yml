name: Daily PIB UPSC Brief Automation

on:
  schedule:
    # Runs every day at 15:30 UTC = 9:00 PM IST (when all daily PIB releases are published)
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

permissions:
  contents: write

jobs:
  run-pib-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily PIB Pipeline
        run: |
          python main.py --today

      - name: Upload Daily Brief Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pib-daily-briefs
          path: output/*.*
          retention-days: 30

      - name: Commit and Push Daily Archive
        run: |
          git config --global user.name "PIB Automation Bot"
          git config --global user.email "bot@pib-upsc.internal"
          git add output/
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-archive: Daily PIB UPSC Brief $(date +'%Y-%m-%d')"
            git push
          fi
